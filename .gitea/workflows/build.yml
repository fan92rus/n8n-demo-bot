name: build

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
      options: --add-host gitea.local:192.168.1.96
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"
        with:
          fetch-depth: 1
      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check bot/ tests/
      - name: Tests
        run: pytest -q

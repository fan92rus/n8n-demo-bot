server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Мини-апп правится часто — HTML всегда свежий
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Last-Modified "";
    }
    location / {
        add_header Cache-Control "no-cache";
    }
}
